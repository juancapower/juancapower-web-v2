name: Validate and deploy staging
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:backend
      - name: Validate root deployment paths
        run: BASE_PATH=/ npm run build && BASE_PATH=/ npm run check:static
      - run: npm run build
      - run: npm run check:static
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/
            docs/gallery-review/
      - name: Upload independent design preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: power-presence-static-preview
          path: dist/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  capture-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - run: npx playwright install --with-deps chromium
      - run: npm run build:capture-preview
      - run: npm run test:capture
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-synthetic-evidence
          path: capture-results/
  legal-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:legal-preview
      - run: npm run test:legal
      - name: Upload consent and legal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-synthetic-evidence
          path: legal-results/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, capture-synthetic, legal-synthetic]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
